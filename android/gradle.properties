org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# -----------------------------
# Proxy template (optional)
# -----------------------------
# If your network requires a proxy to reach plugins.gradle.org / maven repos,
# uncomment and fill these values.
#
# systemProp.http.proxyHost=YOUR_PROXY_HOST
# systemProp.http.proxyPort=YOUR_PROXY_PORT
# systemProp.https.proxyHost=YOUR_PROXY_HOST
# systemProp.https.proxyPort=YOUR_PROXY_PORT
#
# Optional if your proxy requires authentication:
# systemProp.http.proxyUser=YOUR_USERNAME
# systemProp.http.proxyPassword=YOUR_PASSWORD
# systemProp.https.proxyUser=YOUR_USERNAME
# systemProp.https.proxyPassword=YOUR_PASSWORD
#
# Optional hosts that should bypass proxy:
# systemProp.http.nonProxyHosts=localhost|127.0.0.1
